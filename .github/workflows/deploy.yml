name: Sync catalog and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Refresh the official Ollama catalog
        run: python3 scripts/sync_catalog.py --output src/data/models.json

      - name: Test catalog parser
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Persist catalog updates for Cloudflare Pages
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/models.json; then
            echo "Official Ollama catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/models.json
          git commit -m "Refresh official Ollama catalog"
          git push

      - name: Build and upload Astro site
        uses: withastro/action@v6
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_ENABLE_GOOGLE_AUTH: ${{ vars.PUBLIC_ENABLE_GOOGLE_AUTH }}
          PUBLIC_ENABLE_GITHUB_AUTH: ${{ vars.PUBLIC_ENABLE_GITHUB_AUTH }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        with:
          node-version: 22
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
